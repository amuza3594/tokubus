name = "tokubus"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 非機密の設定値（機密情報は `wrangler secret put` で別途設定する。README参照）
[vars]
GITHUB_OWNER = "amuza3594"
GITHUB_REPO = "tokubus"
GITHUB_BRANCH = "claude/tokushima-bus-survey-digitalization-j5syhq"

# KVネームスペース（パスワードのハッシュを保存する場所）
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "0a38e0da08acfc98e652cd818b4cf8c4"
